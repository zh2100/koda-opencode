name: Koda Linux desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            bun_cpu: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            bun_cpu: arm64
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install dependencies
        working-directory: .
        run: bun install --os=linux --cpu=${{ matrix.bun_cpu }}
      - name: Build renderer and main process
        run: |
          for attempt in 1 2; do
            bun run build && exit 0
            if [ "$attempt" = "2" ]; then exit 1; fi
            echo "Build aborted; retrying after cleanup"
            rm -rf out
            sleep 5
          done
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_ELECTRON_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          NODE_OPTIONS: --max-old-space-size=4096
          BUN_CONFIG_MAX_CONCURRENCY: 2
      - name: Cache bundled GDAL
        uses: actions/cache@v4
        with:
          path: packages/desktop/.cache/gdal
          key: koda-gdal-linux-${{ matrix.arch }}-${{ hashFiles('packages/desktop/scripts/prepare-gdal.ts') }}-${{ vars[format('KODA_GDAL_LINUX_{0}_SHA256', matrix.arch)] }}
      - name: Stage bundled GDAL
        if: ${{ vars[format('KODA_GDAL_LINUX_{0}_ARCHIVE_URL', matrix.arch)] != '' && vars[format('KODA_GDAL_LINUX_{0}_SHA256', matrix.arch)] != '' }}
        run: bun run prepare:gdal
        env:
          KODA_GDAL_ARCHIVE_URL: ${{ vars[format('KODA_GDAL_LINUX_{0}_ARCHIVE_URL', matrix.arch)] }}
          KODA_GDAL_ARCHIVE_SHA256: ${{ vars[format('KODA_GDAL_LINUX_{0}_SHA256', matrix.arch)] }}
          OPENCODE_ELECTRON_ARCH: ${{ matrix.arch }}
          KODA_BUNDLE_GDAL: ${{ vars[format('KODA_GDAL_LINUX_{0}_ARCHIVE_URL', matrix.arch)] != '' && vars[format('KODA_GDAL_LINUX_{0}_SHA256', matrix.arch)] != '' && '1' || '0' }}
      - name: Package Koda client
        run: bunx electron-builder --linux --${{ matrix.arch }} --config electron-builder.config.ts --publish never
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_ELECTRON_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KODA_BUNDLE_GDAL: ${{ vars[format('KODA_GDAL_LINUX_{0}_ARCHIVE_URL', matrix.arch)] != '' && vars[format('KODA_GDAL_LINUX_{0}_SHA256', matrix.arch)] != '' && '1' || '0' }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Koda-desktop-linux-${{ matrix.arch }}
          path: |
            packages/desktop/dist/Koda-desktop-linux-*.AppImage
            packages/desktop/dist/Koda-desktop-linux-*.deb
            packages/desktop/dist/Koda-desktop-linux-*.rpm
          if-no-files-found: error
