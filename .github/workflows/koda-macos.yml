name: Koda macOS desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            bun_cpu: arm64
          - arch: x64
            runner: macos-13
            bun_cpu: x64
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Setup Apple API Key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
      - name: Install dependencies
        working-directory: .
        run: bun install --os=darwin --cpu=${{ matrix.bun_cpu }}
      - name: Build renderer and main process
        run: |
          for attempt in 1 2; do
            bun run build && exit 0
            if [ "$attempt" = "2" ]; then exit 1; fi
            echo "Build aborted; retrying after cleanup"
            rm -rf out
            sleep 5
          done
        env:
          OPENCODE_CHANNEL: prod
          NODE_OPTIONS: --max-old-space-size=4096
          BUN_CONFIG_MAX_CONCURRENCY: 2
      - name: Package signed Koda client
        run: bunx electron-builder --mac --${{ matrix.arch }} --config electron-builder.config.ts --publish never
        env:
          OPENCODE_CHANNEL: prod
          CSC_KEYCHAIN: build.keychain
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify macOS signature
        run: |
          APP_PATH=$(find dist -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Koda-desktop-mac-${{ matrix.arch }}
          path: packages/desktop/dist/Koda-desktop-mac-${{ matrix.arch }}.*
          if-no-files-found: error
